<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>ОГЭ–ЕГЭ Навигатор 2027</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f3ec}iframe{display:block;border:0;width:100vw;height:100vh;height:100dvh}</style>
</head>
<body>
  <iframe id="trainer" title="ОГЭ–ЕГЭ Навигатор 2027" src="oge-trainer-2026.html?v=20270903-9"></iframe>
  <script>
    const frame=document.getElementById('trainer');
    frame.addEventListener('load',()=>{
      const d=frame.contentDocument;
      const w=frame.contentWindow;
      if(!d||d.getElementById('question-bank-fix')) return;

      if(w.Peer && !w.Peer.__ogeWrapped){
        const NativePeer=w.Peer;
        function StablePeer(id,options={}){
          const stable={
            host:'0.peerjs.com',
            port:443,
            path:'/',
            secure:true,
            key:'peerjs',
            config:{iceServers:[
              {urls:'stun:stun.l.google.com:19302'},
              {urls:'stun:stun1.l.google.com:19302'},
              {urls:'stun:stun.cloudflare.com:3478'}
            ],sdpSemantics:'unified-plan'}
          };
          return new NativePeer(id,{...stable,...options,config:options.config||stable.config});
        }
        StablePeer.prototype=NativePeer.prototype;
        StablePeer.__ogeWrapped=true;
        w.Peer=StablePeer;
      }

      const s=d.createElement('script');
      s.id='question-bank-fix';
      s.src='question-bank-fix.js?v=20270903-9';
      s.onload=()=>{
        const a=d.createElement('script');
        a.id='question-bank-all-fix';
        a.src='question-bank-all-fix.js?v=20270903-9';
        a.onload=()=>{
          const f=d.createElement('script');
          f.id='question-bank-final-fix';
          f.src='question-bank-final-fix.js?v=20270903-9';
          f.onload=()=>{
            const m=d.createElement('script');
            m.id='my-subjects';
            m.src='my-subjects.js?v=20270903-9';
            d.body.appendChild(m);
          };
          d.body.appendChild(f);
        };
        d.body.appendChild(a);
      };
      d.body.appendChild(s);
    });
  </script>
</body>
</html>
