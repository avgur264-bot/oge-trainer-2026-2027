<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <link rel="canonical" href="https://avgur264-bot.github.io/oge-trainer-2026-2027/">
  <title>ОГЭ–ЕГЭ Навигатор 2027</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f3ec}iframe{display:block;border:0;width:100vw;height:100vh;height:100dvh}</style>
  <script>
    // Все старые ссылки вида ?v=... автоматически приводим к одной постоянной ссылке.
    if (location.search || location.hash) {
      history.replaceState(null,'',location.pathname);
    }
  </script>
</head>
<body>
  <iframe id="trainer" title="ОГЭ–ЕГЭ Навигатор 2027" src="oge-trainer-2026.html?v=20270903-10"></iframe>
  <script>
    const BUILD='20270903-10';
    const frame=document.getElementById('trainer');
    frame.addEventListener('load',()=>{
      const d=frame.contentDocument;
      const w=frame.contentWindow;
      if(!d||d.getElementById('question-bank-fix')) return;

      if(w.Peer && !w.Peer.__ogeWrapped){
        const NativePeer=w.Peer;
        function StablePeer(id,options={}){
          const stable={
            host:'0.peerjs.com',
            port:443,
            path:'/',
            secure:true,
            key:'peerjs',
            config:{iceServers:[
              {urls:'stun:stun.l.google.com:19302'},
              {urls:'stun:stun1.l.google.com:19302'},
              {urls:'stun:stun.cloudflare.com:3478'}
            ],sdpSemantics:'unified-plan'}
          };
          return new NativePeer(id,{...stable,...options,config:options.config||stable.config});
        }
        StablePeer.prototype=NativePeer.prototype;
        StablePeer.__ogeWrapped=true;
        w.Peer=StablePeer;
      }

      const load=(id,src,done)=>{
        const el=d.createElement('script');
        el.id=id;
        el.src=src+'?v='+BUILD;
        if(done) el.onload=done;
        d.body.appendChild(el);
      };
      load('question-bank-fix','question-bank-fix.js',()=>{
        load('question-bank-all-fix','question-bank-all-fix.js',()=>{
          load('question-bank-final-fix','question-bank-final-fix.js',()=>{
            load('my-subjects','my-subjects.js');
          });
        });
      });
    });
  </script>
</body>
</html>
