<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <link rel="canonical" href="https://avgur264-bot.github.io/oge-trainer-2026-2027/">
  <title>ОГЭ–ЕГЭ Навигатор 2027</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f3ec}iframe{display:block;border:0;width:100vw;height:100vh;height:100dvh}</style>
  <script>if(location.search||location.hash)history.replaceState(null,'',location.pathname);</script>
</head>
<body>
  <iframe id="trainer" title="ОГЭ–ЕГЭ Навигатор 2027" src="oge-trainer-2026.html?v=20270903-17"></iframe>
  <script>
    const BUILD='20270903-17';
    const frame=document.getElementById('trainer');
    frame.addEventListener('load',()=>{
      const d=frame.contentDocument;
      if(!d||d.getElementById('question-bank-fix'))return;
      const load=(id,src,done)=>{const el=d.createElement('script');el.id=id;el.src=src+'?v='+BUILD;if(done)el.onload=done;d.body.appendChild(el)};
      load('question-bank-fix','question-bank-fix.js',()=>{
        load('question-bank-all-fix','question-bank-all-fix.js',()=>{
          load('question-bank-final-fix','question-bank-final-fix.js',()=>{
            load('my-subjects','my-subjects.js',()=>{
              load('practice-bank-core','practice-bank-core.js',()=>{
                load('practice-bank-all','practice-bank-all.js',()=>{
                  load('fipi-2027-rules','fipi-2027-rules.js',()=>{
                    load('practice-bank-10x','practice-bank-10x.js',()=>{
                      load('trainer-upgrade-v2','trainer-upgrade-v2.js',()=>{
                        load('bank-quality-final','bank-quality-final.js',()=>{
                          load('room-network-fix','room-network-fix.js');
                        });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  </script>
</body>
</html>
